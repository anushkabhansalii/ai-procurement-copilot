name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - name: Starter pre-flight (data, contract, mock API)
        run: python verify_setup.py
      - name: Offline unit tests (no API key, no network model calls)
        run: python -W ignore -m unittest discover -s tests
      - name: Rules-only evaluation on the 10 cases and the 15 held-out cases
        run: |
          python evals/run_eval.py --provider stub --out /tmp/floor
          python evals/run_holdout.py --provider stub --out /tmp/holdout_floor || true
